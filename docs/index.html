<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="description" content="Польский с нуля до A2: 46 уроков, грамматика, задания как в учебнике и словарь на 1000+ слов.">
<meta property="og:title" content="Mówię — польский с нуля">
<meta property="og:description" content="46 уроков, грамматика и словарь. Бесплатно в браузере.">
<title>Mówię A1–A2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one app column (max 760px). Sticky top bar; home = cover + course map; lesson = sections A, B, C… each "theory page → tasks page", fixed bottom action bar.
   Brand: deep blue + Polish red; the logo is an "o" drawn as a speech bubble with a red acute accent (ó). */
:root{
  --paper:#F5F6FA; --card:#FFFFFF; --ink:#101735; --muted:#5A6284; --line:#DDE1EE;
  --blue:#1F3FB0; --blue-soft:#E5EAFB; --on-accent:#FFFFFF;
  --red:#D62839; --red-soft:#FCE6E8;
  --ok:#1C8350; --ok-soft:#DDF3E6; --bad:#C0283A; --bad-soft:#FCE6E8;
  --hero-a:#2A4CC4; --hero-b:#12226E;
  --shadow:0 1px 2px rgba(16,23,53,.06), 0 8px 28px rgba(16,23,53,.07);
  --f-display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
  --brand-red:#E5323F; --brand-blue:#1D3AA6;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0C1124; --card:#151B33; --ink:#E8EBF7; --muted:#9AA2C3; --line:#283052;
  --blue:#8CA2FF; --blue-soft:#1C2752; --on-accent:#0C1124;
  --red:#FF6B78; --red-soft:#3A1820;
  --ok:#4FCB86; --ok-soft:#12301F; --bad:#FF6B78; --bad-soft:#3A1820;
  --hero-a:#22409F; --hero-b:#0E1A52;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.28);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0C1124; --card:#151B33; --ink:#E8EBF7; --muted:#9AA2C3; --line:#283052;
  --blue:#8CA2FF; --blue-soft:#1C2752; --on-accent:#0C1124;
  --red:#FF6B78; --red-soft:#3A1820;
  --ok:#4FCB86; --ok-soft:#12301F; --bad:#FF6B78; --bad-soft:#3A1820;
  --hero-a:#22409F; --hero-b:#0E1A52;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.28);
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.45rem,4.6vw,2rem);letter-spacing:-.01em}
h2{font-size:1.22rem}
h3{font-size:1.02rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.pl{font-weight:600}
.red{color:var(--red)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.logo{display:block;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:-.01em;background:none;border:0;padding:4px 0;display:flex;align-items:center;gap:9px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill b{color:var(--blue)}
.pill.st b{color:var(--red)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .08s, background .15s}
.btn:hover{border-color:var(--blue)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none}
.play{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;padding:0}
.play:hover{border-color:var(--blue);color:var(--blue)}
.play svg{width:14px;height:14px}
.play.big{width:72px;height:72px}
.play.big svg{width:26px;height:26px}
.toggle{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600}
.toggle[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}

/* cover */
main{padding-block:20px 120px}
.cover{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#FFFFFF;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.cover .flag{position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(to bottom,#FFFFFF 0 38%,var(--brand-red) 38%)}
.cover-in{padding:28px 24px 42px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.wm{font-family:var(--f-display);font-weight:700;font-size:clamp(2.5rem,9vw,3.7rem);line-height:1;letter-spacing:-.02em;display:flex;align-items:center;gap:14px}
.wm .r{color:#FF5A66}
.cover .tag{font-size:1.15rem;font-weight:600}
.cover .sub{color:#C9D3FF;max-width:44ch}
.bubs{position:relative;min-height:220px}
.bub{position:absolute;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;line-height:1}
.bub.w{background:#FFFFFF;color:var(--brand-blue)}
.bub.r{background:var(--brand-red);color:#FFFFFF}
.bub.g{background:rgba(255,255,255,.15);color:#FFFFFF}
.bub.w.rt{color:var(--brand-red)}

.cont{margin-top:14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.meter{height:8px;border-radius:99px;background:var(--blue-soft);overflow:hidden}
.meter>div{height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.meta{font-size:.9rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.stat .v{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat .k{font-size:.8rem;color:var(--muted)}
button.stat:hover{border-color:var(--blue)}
.part{margin-top:30px}
.part-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.part-h .n{font-family:var(--f-display);color:var(--red);font-size:.85rem}
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ls{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.ls .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:.8rem;border:1.5px dashed var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.ls .t{min-width:0}
.ls .t .pl{display:block}
.ls .t small{display:block;color:var(--muted);font-size:.82rem;line-height:1.4}
.ls .stt{font-size:.75rem;color:var(--muted);white-space:nowrap}
.ls.open{cursor:pointer}
.ls.open .num{border:0;background:var(--blue);color:var(--on-accent)}
.ls.open:hover .pl{color:var(--blue)}
.ls.done .num{background:var(--ok);color:var(--on-accent)}
.ls.locked .pl{color:var(--muted)}
.foot{margin-top:36px;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:10px}

/* lesson chrome */
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stp{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.stp .sl{font-family:var(--f-display);font-size:.7rem;color:var(--red)}
.stp.task{border-style:dashed}
.stp.seen{color:var(--ink)}
.stp.fin{border-color:var(--ok);border-style:solid}
.stp.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stp.on .sl{color:var(--paper)}
.lhead{display:flex;flex-direction:column;gap:6px;margin:6px 0 18px}
.sec-badge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--red);color:#FFFFFF;font-family:var(--f-display);font-size:.85rem;margin-right:4px;vertical-align:middle}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;gap:10px;align-items:center;min-height:68px;padding-block:10px}
.bar .sp{flex:1}
.bar.ok{background:var(--ok-soft);border-top-color:var(--ok)}
.bar.bad{background:var(--bad-soft);border-top-color:var(--bad)}
.fbt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.fbt b{font-family:var(--f-display);font-size:1rem}
.bar.ok .fbt b{color:var(--ok)}
.bar.bad .fbt b{color:var(--bad)}
.fbt span{font-size:.9rem}

/* content blocks */
.goals{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.goals li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.goals li::before{content:"";width:14px;height:14px;margin-top:5px;border-radius:50%;border:2px solid var(--blue)}
.callout{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.note{background:var(--blue-soft);border-radius:var(--r);padding:12px 14px}
.trap{background:var(--red-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.trap .lb{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--red)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.fact b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--blue)}
.fact span{font-size:.9rem;color:var(--muted)}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.who{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start}
.who p{font-size:.9rem;color:var(--muted)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:.85rem;color:#FFFFFF;flex:none}
.av.sm{width:36px;height:36px;font-size:.72rem}
.av.maks{background:#2747C2} .av.kasia{background:#D62839} .av.andrzej{background:#3B4A6B} .av.ewa{background:#A8326E} .av.kot{background:#C2770F}
.quote{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:44px 1fr 34px;gap:12px;align-items:start}
.quote .q{font-size:1.2rem;font-weight:600}

/* alphabet */
.ab-detail{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ab-big{font-family:var(--f-display);font-size:3.2rem;line-height:1;color:var(--blue);min-width:2.4em;text-align:center}
.ab-big.sp{color:var(--red)}
.ab-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.ab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ab{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ab b{font-family:var(--f-display);font-size:1.15rem;font-weight:500}
.ab small{font-size:.7rem;color:var(--muted)}
.ab.sp b{color:var(--red)}
.ab:hover{border-color:var(--blue)}
.ab.sel{border-color:var(--blue);background:var(--blue-soft)}
.ab.now{border-color:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* sound rows */
.snd{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.snd .let{font-family:var(--f-display);font-size:1.2rem;color:var(--blue)}
.snd .how{font-size:.95rem}
.snd .ex{display:flex;align-items:center;gap:10px;justify-content:flex-end;text-align:right}
.snd .ex small{display:block;color:var(--muted);font-size:.8rem}
.tbl-w{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:480px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t .big{font-family:var(--f-display);color:var(--red);font-size:1.05rem}
.t small{color:var(--muted)}
.say{cursor:pointer;border-bottom:1.5px dotted color-mix(in srgb,var(--blue) 55%,transparent)}
.say:hover{color:var(--blue)}
.stress b{color:var(--red);text-decoration:underline;text-underline-offset:3px}
.rules{display:flex;flex-direction:column;gap:22px}
.rule{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;display:inline-flex;gap:8px;align-items:baseline}
.chip small{color:var(--muted)}
.rd{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rd .pl{font-size:1.15rem}
.rd .tr{color:var(--muted);font-size:.92rem}
.rd .tr.hid{filter:blur(6px);cursor:pointer}

/* dialog */
.scene{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.scene .flagline{height:6px;background:linear-gradient(to right,var(--brand-blue) 0 50%,var(--brand-red) 50%)}
.scene-h{padding:16px 18px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.scene-h p{color:var(--muted);font-size:.95rem}
.ln{display:grid;grid-template-columns:36px 1fr 34px;gap:12px;padding:12px 18px;align-items:start;border-bottom:1px solid var(--line);transition:background .2s}
.ln:last-child{border-bottom:0}
.ln.now{background:var(--blue-soft)}
.ln .nm{font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ln .tx{font-size:1.1rem;font-weight:600;line-height:1.45}
.ln .tr{font-size:.92rem;color:var(--muted)}
.hide-tr .ln .tr{display:none}
.w{border-bottom:1.5px dotted color-mix(in srgb,var(--blue) 55%,transparent);cursor:pointer}
.w:hover{color:var(--blue)}
.pop{position:absolute;z-index:20;max-width:260px;background:var(--ink);color:var(--paper);font-size:.88rem;padding:8px 12px;border-radius:10px;box-shadow:var(--shadow);pointer-events:none}
.pop b{display:block;font-size:.95rem}

/* vocab + grammar */
.vgroup{display:flex;flex-direction:column;gap:6px}
.vgroup h3{margin-bottom:4px}
.vrow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow .pl{font-size:1.05rem}
.vrow .ru{color:var(--muted)}
.self .vrow .ru{filter:blur(6px);cursor:pointer;transition:filter .2s}
.self .vrow .ru.peek{filter:none}
.self .wrow .ru{filter:blur(6px);cursor:pointer;transition:filter .2s}
.self .wrow .ru.peek{filter:none}
.gsec{display:flex;flex-direction:column;gap:12px}
table.conj{border-collapse:collapse;width:100%;min-width:440px;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.conj td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.conj tr:last-child td{border-bottom:0}
.conj td:nth-child(2n){color:var(--muted);font-size:.85rem}
.conj td:nth-child(3){border-left:1px solid var(--line)}
.conj .f{color:var(--red);font-weight:700}
.exl{display:flex;flex-direction:column;gap:6px;padding-left:0;margin:0;list-style:none}
.exl li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.exl li span:last-child{color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.numc{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.numc:hover{border-color:var(--blue)}
.numc b{font-family:var(--f-display);font-size:1.6rem;color:var(--blue);font-variant-numeric:tabular-nums}
.numc span{font-weight:600}
.numc small{color:var(--muted)}

/* practice */
.task-h{display:flex;align-items:center;gap:10px}
.exp{height:10px;border-radius:99px;background:var(--blue-soft);overflow:hidden}
.exp>div{height:100%;background:var(--blue);transition:width .3s}
.exq{font-family:var(--f-display);font-size:1.08rem;font-weight:500;line-height:1.35}
.sent{font-size:1.35rem;font-weight:600;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.gap{display:inline-block;min-width:90px;border-bottom:2.5px solid var(--blue);text-align:center;color:var(--blue)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;font-size:1.05rem;font-weight:500;display:flex;gap:12px;align-items:center}
.opt kbd{font-family:var(--f-body);font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opts.pair{flex-direction:row}
.opts.pair .opt{flex:1;justify-content:center;font-size:1.4rem;font-weight:700}
.syls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 0}
.syl{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:14px 18px;font-size:1.4rem;font-weight:700}
.syl:hover:not([disabled]){border-color:var(--blue)}
.syl.right{border-color:var(--ok);background:var(--ok-soft)}
.syl.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* ============ COMPACT LESSON FORMAT (lessons 3+) ============
   Exercise lines, fields split by "|", options by ";":
   mcq|вопрос|o1;o2;o3|верный|пояснение|озвучить
   audio|вопрос|слово|o1;o2;o3|верный|пояснение
   fill|вопрос|фраза с ___|o1;o2;o3|верный|пояснение
   listen|вопрос|текст|o1;o2;o3|верный|пояснение
   build|вопрос|правильная фраза|лишние слова|пояснение
   type|вопрос|ответ1;ответ2|пояснение|аудио
   match|вопрос|pl=ru;pl=ru
   stress|вопрос|слог-слог-слог|верный|пояснение            */
const lines=s=>String(s||"").trim().split("\n").map(l=>l.trim()).filter(Boolean);
function parseEx(src){
  return lines(src).map(l=>{
    const f=l.split("|"), t=f[0];
    if(t==="mcq") return {t:"mcq",q:f[1],opts:f[2].split(";"),a:+f[3],why:f[4]||"",say:f[5]||""};
    if(t==="audio") return {t:"mcq",q:f[1],audio:f[2],opts:f[3].split(";"),a:+f[4],why:f[5]||""};
    if(t==="fill"){const opts=f[3].split(";"); return {t:"fill",q:f[1],s:f[2],opts,a:+f[4],why:f[5]||"",say:f[2].replace("___",opts[+f[4]])};}
    if(t==="listen"){const opts=f[3].split(";"); return {t:"listen",q:f[1],text:f[2],opts,a:+f[4],why:f[5]||"",pair:opts.length===2&&opts.every(o=>o.length<14)};}
    if(t==="build"){const ans=f[2]; const tiles=ans.replace(/[.,!?]/g,"").split(" ").concat(f[3]?f[3].split(" "):[]); return {t:"build",q:f[1],tiles,answer:ans,why:f[4]||""};}
    if(t==="type") return {t:"type",q:f[1],answers:f[2].split(";"),why:f[3]||"",audio:f[4]||""};
    if(t==="match") return {t:"match",q:f[1],pairs:f[2].split(";").map(p=>p.split("="))};
    if(t==="stress") return {t:"stress",q:f[1],word:f[2].replace(/-/g,""),syl:f[2].split("-"),a:+f[3],why:f[4]||""};
    if(t==="cloze") return {t:"cloze",pl:f[1],q:f[2],lines:parseCloze(f[3]),bank:/bank/.test(f[4]||""),audio:/audio/.test(f[4]||""),extra:(f[5]||"").split(" ").filter(Boolean)};
    if(t==="tab"){const hdr=f[3].split(";"), rows=f[4].split(" // ").map(r=>r.split(";").map(c=>({pr:"",segs:parseCloze(c)[0]}))); return {t:"tcloze",plain:true,pl:f[1],q:f[2],cap:f[6]||"Tabelka",headPlain:hdr,rows,lines:rows.map(r=>r.flatMap(c=>c.segs)),bank:/bank/.test(f[5]||"")};}
    if(t==="order") return {t:"order",pl:f[1],q:f[2],items:f[3].split(" // ").map(x=>x.trim())};
    console.warn("bad exercise",l); return null;
  }).filter(Boolean);
}
function parseVocab(src){let c="Слова урока"; const out=[]; lines(src).forEach(l=>{ if(l.startsWith("#")){c=l.slice(1).trim(); return;} const f=l.split("|"); out.push({c,pl:f[0],ru:f[1],ex:f[2]||"",exr:f[3]||""}); }); return out;}
/* cloze text: [answer] or [variant1/variant2] marks a gap, " // " starts a new line */
function parseCloze(text){
  return text.split(" // ").map(line=>{const out=[]; let last=0; line.replace(/\[([^\]]+)\]/g,(m,a,i)=>{ if(i>last) out.push(line.slice(last,i)); out.push({a:a.split("/").map(x=>x.trim())}); last=i+m.length; return m;}); if(last<line.length) out.push(line.slice(last)); return out;});
}
const clozeFull=e=>e.audioText||e.lines.map(l=>l.map(s=>typeof s==="string"?s:s.a[0]).join("")).join(" ");
/* extra book-style exercises added to a lesson section from separate data files */
function CZ(n,sec,src){ const L=LESSONS[n]; if(!L) return; const st=L.steps.find(s=>s.k==="practice"&&s.sec===sec); if(st) st.ex.push(...parseEx(src)); else console.warn("CZ: no section",n,sec); }
const SEC_LABEL={scene:"Диалог",grammar:"Грамматика",vocab:"Słówka",text:"Текст"};
function LX(d){
  const L={id:d.n,title:d.title,ru:d.ru,intro:d.intro||"",goals:d.goals||[],who:d.who||[],vocab:parseVocab(d.vocab),dict:d.dict||{},steps:[{k:"intro",label:"Введение"}]};
  (d.secs||[]).forEach((s,i)=>{
    const sec="ABCDEFG"[i], st=Object.assign({},s,{sec,label:s.lab||SEC_LABEL[s.k]||"Раздел"});
    if(s.k==="scene") st.scene={pl:s.pl,ru:s.ru,place:s.place||"",desc:s.desc||"",lines:lines(s.lines).map(x=>x.split("|"))};
    if(s.k==="text") st.paras=lines(s.text).map(x=>x.split("|"));
    delete st.ex; L.steps.push(st);
    if(s.ex) L.steps.push({k:"practice",label:"Задания",sec,ex:parseEx(s.ex)});
  });
  L.steps.push({k:"done",label:"Итог"});
  LESSONS[d.n]=L;
}

const GTAGS={}, CASES=[], VREFS=[];
function GT(n,sec,term){GTAGS[n+sec]=term;}
function CASE(c){CASES.push(c);}
function VREF(v){VREFS.push(v);}
/* word grammar: nouns (gender, plural), verbs (ja/ty, aspect), adjectives (by rule) */
const GN={}, GV={}, GA=new Set();
const gkey=pl=>pl.toLowerCase().replace(/[.,!?…]/g,"").replace(/\s+/g," ").trim();
function NG(src){lines(src).forEach(l=>{const f=l.split("|"); GN[gkey(f[0])]={g:f[1],pl:(f[2]||"").trim()};});}
function VG(src){lines(src).forEach(l=>{const f=l.split("|"); GV[gkey(f[0])]={f:f[1],a:(f[2]||"").trim()};});}
function AG(src){src.trim().split(/\s+/).forEach(x=>GA.add(x));}
const GLAB={m:"м. р.",ż:"ж. р.",n:"ср. р."};
function adjForms(a){ if(/[kg]i$/.test(a)) return [a,a.slice(0,-1)+"a",a.slice(0,-1)+"ie"]; if(/i$/.test(a)) return [a,a+"a",a+"e"]; if(/y$/.test(a)) return [a,a.slice(0,-1)+"a",a.slice(0,-1)+"e"]; return null; }
function gramInfo(w){
  const k=gkey(w.pl);
  const n=GN[k];
  if(n) return n.g==="pl"?`<b>l. mn.</b> только мн. ч.${n.pl?" · "+n.pl:""}`:`<b>${n.g}</b> ${GLAB[n.g]}${n.pl==="—"?" · мн. ч. не употр.":n.pl?` · мн. ч.: ${n.pl}`:""}`;
  let v=GV[k]; if(!v){const t=k.split(" "); if(t.length>1) v=GV[t.slice(0,2).join(" ")]||GV[t[0]];}
  if(v){ const perf=v.a.startsWith("ndk"); return `${perf?"<b>dk</b> буд.: ":"<b>ndk</b> "}${v.f}${v.a?` · ${perf?"несов.: "+v.a.slice(4):"сов.: "+v.a.slice(3)}`:""}`; }
  if(GA.has(k)){const f=adjForms(k); if(f) return `<b>прил.</b> ${f.join(", ")}`;}
  return "";
}
const giHTML=w=>{const g=gramInfo(w); return g?`<small class="ginfo">${g}</small>`:"";};

/* ============ SPEECH ============ */
let plVoices=[], playTok=0;
const MALE=/marek|adam|krzysztof|jacek|piotr|tomasz|jan\b/i;
function loadVoices(){ if(!("speechSynthesis" in window)) return; plVoices=speechSynthesis.getVoices().filter(v=>/^pl/i.test(v.lang)); }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(g){
  if(!plVoices.length) return null;
  const q=v=>/natural|online|neural|google/i.test(v.name)?1:0;
  const list=[...plVoices].sort((a,b)=>q(b)-q(a));
  if(g==="m"){const m=list.find(v=>MALE.test(v.name)); if(m) return m;}
  if(g==="f"){const f=list.find(v=>!MALE.test(v.name)); if(f) return f;}
  return list[0];
}
function speak(text,o={}){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)) return res();
    let fin=false; const end=()=>{if(!fin){fin=true;res();}};
    const u=new SpeechSynthesisUtterance(String(text).replace(/…/g,"."));
    u.lang="pl-PL"; const v=pickVoice(o.g); if(v) u.voice=v;
    u.rate=S.slow?0.66:0.9; u.pitch=o.pitch||1; u.onend=end; u.onerror=end;
    speechSynthesis.speak(u);
    setTimeout(end,1500+String(text).length*(S.slow?140:95));
  });
}
function stopAll(){playTok++; if("speechSynthesis" in window) speechSynthesis.cancel(); document.querySelectorAll(".ln.now,.ab.now").forEach(n=>n.classList.remove("now"));}
function say(text,who){stopAll(); speak(text,CH[who||"ewa"]||{});}
const ICON_PLAY='<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';
function playBtn(text,who,cls=""){return `<button class="play ${cls}" data-act="say" data-t="${esc(text)}" data-w="${who||"ewa"}" aria-label="Слушать: ${esc(text)}">${ICON_PLAY}</button>`;}
function voiceBanner(){
  if(!("speechSynthesis" in window)) return `<div class="banner">Этот браузер не умеет озвучивать текст. Откройте страницу в Chrome или Edge.</div>`;
  if(plVoices.length) return "";
  return `<div class="banner" id="vb">Польский голос пока не найден. Если звука нет, откройте страницу в <b>Microsoft Edge</b> или <b>Chrome</b> либо добавьте польский голос в Windows: Параметры → Время и язык → Речь → Добавить голоса → Polski.</div>`;
}

const app=document.getElementById("app"), bar=document.getElementById("bar"), barin=document.getElementById("barin"), pop=document.getElementById("pop");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function shuffle(a){a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
const DIA={"ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ź":"z","ż":"z"};
const norm=s=>s.toLowerCase().replace(/[.,!?…„"«»:;]/g,"").replace(/\s+/g," ").trim();
const flat=s=>norm(s).replace(/[ąćęłńóśźż]/g,ch=>DIA[ch]);
const sp=t=>t.replace(" / "," … ");
function tokenize(text,dict){
  return text.split(/(\s+)/).map(tok=>{
    const m=tok.match(/^([„"(«]*)(.*?)([.,!?…»")]*)$/); if(!m||!m[2]) return esc(tok);
    const k=m[2].toLowerCase();
    return dict[k]?`${esc(m[1])}<span class="w" data-k="${esc(k)}" data-o="${esc(m[2])}">${esc(m[2])}</span>${esc(m[3])}`:esc(tok);
  }).join("");
}
function setBar(html,cls=""){ if(html===null){bar.hidden=true; return;} bar.hidden=false; bar.className="bar "+cls; barin.innerHTML=html; }

const dictOf=L=>Object.assign({},GDICT,L.dict||{});
const practiceSteps=L=>L.steps.map((s,i)=>s.k==="practice"?i:-1).filter(i=>i>=0);
function lessonPct(L){const lp=LP(L.id); if(lp.done) return 100; const ps=practiceSteps(L); const d=ps.filter(i=>lp.sets[i]).length; return Math.round((lp.seen/(L.steps.length-1)*0.5+d/ps.length*0.5)*100);}
function setTotals(L){const lp=LP(L.id); let f=0,t=0; Object.values(lp.sets).forEach(x=>{f+=x.first;t+=x.total;}); return {f,t};}

/* grammar blocks for compact lessons:
   "html"            paragraph
   {h:"…"}           subheading
   {tbl:"ja jestem=я;my jesteśmy=мы|ty…"} conjugation table: rows by "|", cells "pl=ru;pl=ru"
   {t:"Заголовок1;Заголовок2|a;b|c;d"}    generic table, first row = header
   {ex:"pl=ru|pl=ru"} examples with audio
   {note:"…"} {trap:"…"}                                         */
function splitForms(tbl){
  const cells=tbl.split("|").map(r=>r.split(";").map(c=>{const [pl,ru]=c.split("="); const m=pl.match(/^(\S+(?: \/ \S+)*)\s+([^\/\s].*)$/); return {pr:m?m[1]:"",form:m?m[2]:pl,ru:ru||""};}));
  const words=cells.flat().filter(c=>c.pr).map(c=>c.form.replace(/<[^>]+>/g,"").split(" ")[0]);
  let stem=words.length?words[0]:"";
  words.forEach(w=>{let i=0; while(i<stem.length&&i<w.length&&stem[i]===w[i]) i++; stem=stem.slice(0,i);});
  if(stem.length<2) stem="";
  return {cells,stem};
}
function formHTML(form,stem){
  const plain=form.replace(/<[^>]+>/g,"");
  if(!stem||!plain.startsWith(stem)) return form;
  const first=plain.split(" ")[0], rest=plain.slice(first.length);
  return esc(stem)+`<span class="end">${esc(first.slice(stem.length))}</span>`+esc(rest);
}
function bookTable(tbl){
  const {cells,stem}=splitForms(tbl), two=cells[0].length>=2&&cells.every(r=>r.some(c=>c.pr));
  const head=two?`<thead><tr><th colspan="3">liczba pojedyncza</th><th colspan="3">liczba mnoga</th></tr></thead>`:"";
  return `<div class="tbl-w"><table class="btab">`+head+`<tbody>${cells.map(r=>`<tr>${r.map((c,ci)=>`<td class="pr${ci?" sep":""}">${c.pr}</td><td><span class="f say" data-act="say" data-t="${esc(c.form.replace(/<[^>]+>/g,""))}">${formHTML(c.form,stem)}</span></td><td class="ru">${c.ru}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function blocks(arr){
  const sayEl=pl=>`<span class="pl say" data-act="say" data-t="${esc(pl.replace(/<[^>]+>/g,""))}">${pl}</span>`;
  return arr.map(b=>{
    if(typeof b==="string") return `<p>${b}</p>`;
    if(b.h) return `<h2>${b.h}</h2>`;
    if(b.note) return `<div class="note">${b.note}</div>`;
    if(b.trap) return `<div class="trap"><span class="lb">${b.lb||"Ловушка"}</span><p>${b.trap}</p></div>`;
    if(b.ex) return `<ul class="exl">${b.ex.split("|").map(p=>{const [pl,ru]=p.split("="); return `<li>${sayEl(pl)}<span>${ru||""}</span></li>`;}).join("")}</ul>`;
    if(b.tbl) return bookTable(b.tbl);
    if(b.tbl) return `<div class="tbl-w"><table class="conj"><tbody>${b.tbl.split("|").map(r=>`<tr>${r.split(";").map(c=>{const [pl,ru]=c.split("="); const m=pl.match(/^(\S+(?: \/ \S+)*)\s+([^\/\s].*)$/); const form=m?m[2]:pl, pr=m?m[1]+" ":""; return `<td>${pr}<span class="f say" data-act="say" data-t="${esc(form.replace(/<[^>]+>/g,""))}">${form}</span></td><td>${ru||""}</td>`;}).join("")}</tr>`).join("")}</tbody></table></div>`;
    if(b.t){const rows=b.t.split("|").map(r=>r.split(";")); return `<div class="tbl-w"><table class="btab"><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map((c,i)=>`<td>${i===0&&b.first!==false?`<b>${c}</b>`:c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}
    return "";
  }).join("");
}

function startPractice(step){P={key:cur+":"+LP(cur).step,ex:step.ex,q:step.ex.map((_,i)=>i),pos:0,first:0,miss:new Set(),answered:false,b:null,m:null};}

    el.innerHTML=head(`Задания к разделу ${step.sec}`,"Раздел пройден",`С первой попытки: ${s.first} из ${s.total}.`,step.sec)+
      `<div class="row"><button class="btn" data-act="redo">Выполнить ещё раз</button></div>`;
    navBar(); return;
  }
  if(!P||P.key!==cur+":"+st) startPractice(step);
  if(P.pos>=P.q.length){finishSet(el,step); return;}

function cFill(w){
  const ins=[...app.querySelectorAll(".gin")]; if(!ins.length||P.answered) return;
  const tgt=(lastInp&&ins.includes(lastInp)&&!lastInp.value)?lastInp:(ins.find(x=>!x.value)||lastInp);
  if(!tgt) return; tgt.value=w;
  const nx=ins.slice(ins.indexOf(tgt)+1).concat(ins).find(x=>!x.value); (nx||tgt).focus();

function cCheck(){
  if(P.answered) return;
  const e=P.ex[P.q[P.pos]], ins=[...app.querySelectorAll(".gin")], gaps=e.lines.flat().filter(s=>typeof s!=="string");
  if(!ins.some(x=>x.value.trim())) return;
  let all=true, near=false;
  ins.forEach((inp,i)=>{ const v=inp.value, g=gaps[i].a;
    const ex=g.some(a=>norm(a)===norm(v)), nr=!ex&&v.trim()&&g.some(a=>flat(a)===flat(v));
    inp.disabled=true;
    if(ex||nr){inp.classList.add("ok"); if(nr){near=true; inp.insertAdjacentHTML("afterend",`<span class="gfix">${esc(g[0])}</span>`);}}
    else {all=false; inp.classList.add("bad"); inp.insertAdjacentHTML("afterend",`<span class="gfix">${esc(g[0])}</span>`);}
  });
  app.querySelectorAll(".cbank .tile").forEach(t=>t.disabled=true);

}

  document.getElementById("tin").disabled=true;

}
function answer(ok,o={}){
  if(P.answered) return; P.answered=true;
  const idx=P.q[P.pos], e=P.ex[idx], credit=o.credit!==false;
  if(ok&&!P.miss.has(idx)&&credit){P.first++; S.xp+=10;}
  if(!ok&&!P.miss.has(idx)){P.miss.add(idx); P.q.push(idx);}
  if(ok&&!credit) P.miss.add(idx);
  touch(); save();
  const sayText=o.sayText||e.say||e.text||e.answer||e.word||e.audio;
  if(sayText) setTimeout(()=>say(sayText),150);
  const title=ok?(o.near?"Почти! Проверьте польские буквы":(credit?"Верно!":"Готово, но с ошибками")):"Не совсем";
  const corr=(!ok||o.near)&&o.correct?`<span>Правильно: <b class="pl">${o.correct}</b></span>`:"";
  setBar(`<div class="fbt"><b>${title}</b>${corr}<span>${e.why||""}</span></div><button class="btn primary" data-act="exnext">Дальше</button>`, ok?"ok":"bad");
  const nb=barin.querySelector('[data-act="exnext"]'); if(nb) nb.focus();
}

function distract(w,f){
  const t=wGroup(w.t); let pool=t?t.words.filter(x=>x.id!==w.id&&x[f]!==w[f]):[];
  if(pool.length<3) pool=allWords().filter(x=>x.id!==w.id&&x[f]!==w[f]);
  return shuffle(pool).slice(0,3).map(x=>x[f]);
}
function renderWSession(){
  window.scrollTo(0,0);
  const tname=WS.tid==="*"?"Все темы":wGroup(WS.tid).pl;
  if(WS.kind==="intro"){
    if(WS.pos>=WS.pool.length||WS.picked.length>=WS.size) return startDrill();
    const w=WS.pool[WS.pos];
    app.innerHTML=head(`Новые слова · ${tname}`,`Выбрано ${WS.picked.length} из ${WS.size}`,"Знакомое слово отметьте «Уже знаю», незнакомое добавьте в тренировку.")+
    `<div class="flash"><span class="wtag">${wGroup(w.t).ru}</span><span class="pl">${w.pl}</span>${giHTML(w)}${playBtn(sp(w.pl))}<span class="ru">${w.ru}</span>${w.ex?`<span class="exs"><span class="pl">${w.ex}</span><br>${w.exr}</span>`:""}</div>`;
    setBar(`<button class="btn ghost" data-act="wquit">Выйти</button><span class="sp"></span><button class="btn" data-act="wknow">Уже знаю</button><button class="btn primary" data-act="wadd">Учить</button>`);
    setTimeout(()=>say(sp(w.pl)),200);
    return;
  }
  if(WS.kind==="sum"){
    setBar(null);
    app.innerHTML=head(WS.title,WS.sub,"")+`<div class="flash"><span class="wq">${WS.big}</span><span class="muted">${WS.note}</span></div>
    <div class="row" style="margin-top:16px">${/^L/.test(WS.tid||"")?`<button class="btn primary" data-act="open" data-i="${WS.tid.slice(1)}">Вернуться к уроку</button>`:""}${WS.more?`<button class="btn primary" data-act="wlearn" data-id="${WS.tid}">Ещё новые слова</button>`:""}<button class="btn" data-act="wback">К темам</button></div>`;
    return;
  }
  if(WS.pos>=WS.items.length) return finishWS();
  const it=WS.items[WS.pos], w=it.w; WS.answered=false;
  const label=WS.kind==="drill"?"Тренировка":"Повторение", mode={pr:"Выберите перевод",rp:"Выберите польское слово",ty:"Напишите по-польски"}[it.m];
  let body="";
  if(it.m==="pr"){
    const opts=shuffle([w.ru,...distract(w,"ru")]); WS.opts=opts; WS.right=opts.indexOf(w.ru);
    body=`<div class="flash" style="min-height:150px"><span class="pl">${w.pl}</span>${playBtn(sp(w.pl))}</div><div class="opts">${opts.map((o,i)=>`<button class="opt" data-act="wpick" data-i="${i}"><kbd>${i+1}</kbd><span>${o}</span></button>`).join("")}</div>`;
    setTimeout(()=>say(sp(w.pl)),200);
  } else if(it.m==="rp"){
    const opts=shuffle([w.pl,...distract(w,"pl")]); WS.opts=opts; WS.right=opts.indexOf(w.pl);
    body=`<div class="flash" style="min-height:150px"><span class="ru wq">${w.ru}</span></div><div class="opts">${opts.map((o,i)=>`<button class="opt pl" data-act="wpick" data-i="${i}"><kbd>${i+1}</kbd><span>${o}</span></button>`).join("")}</div>`;
  } else {
    body=`<div class="flash" style="min-height:150px"><span class="ru wq">${w.ru}</span></div>
    <input class="typein" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Пишите по-польски" aria-label="Ваш ответ">
    <div class="keys">${"ą ć ę ł ń ó ś ź ż".split(" ").map(k=>`<button data-act="key" data-k="${k}">${k}</button>`).join("")}</div>`;
  }
  app.innerHTML=`<div class="stack"><p class="eyebrow">${label} · ${tname} · ${WS.pos+1} из ${WS.items.length}</p>
    <div class="exp"><div style="width:${Math.round(WS.pos/WS.items.length*100)}%"></div></div><p class="exq">${mode}</p>${body}</div>`;
  if(it.m==="ty"){
    setBar(`<button class="btn ghost" data-act="wquit">Выйти</button><span class="sp"></span><button class="btn primary" data-act="wcheck">Проверить</button>`);
    const tin=document.getElementById("tin"); tin.focus();
    tin.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&!WS.answered){ev.preventDefault(); wCheck();}});
  } else setBar(`<button class="btn ghost" data-act="wquit">Выйти</button><span class="sp"></span><span class="muted">Выберите ответ</span>`);
}
function wPick(i,btn){
  if(WS.answered) return;
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true; if(j===WS.right) b.classList.add("right");});
  const ok=i===WS.right; if(!ok) btn.classList.add("wrong");
  wAnswer(ok);
}
function wCheck(){
  const it=WS.items[WS.pos], v=document.getElementById("tin").value; if(!v.trim()) return;
  const variants=it.w.pl.split(" / ").map(x=>x.replace(/…/g,""));
  const exact=variants.some(a=>norm(a)===norm(v)), near=!exact&&variants.some(a=>flat(a)===flat(v));
  document.getElementById("tin").disabled=true;
  wAnswer(exact||near,near);
}
function wAnswer(ok,near){
  WS.answered=true;
  const it=WS.items[WS.pos], w=it.w, s=S.voc[w.id]||(S.voc[w.id]={box:0,due:Date.now()});
  if(ok&&!WS.re.has(w.id+it.m)) WS.ok++;
  if(WS.kind==="review"){
    if(ok&&!it.retry){s.box=Math.min(s.box+1,5); s.due=Date.now()+INT[s.box]*DAY;}
    if(!ok){s.box=1; s.due=Date.now()+DAY; if(!WS.re.has(w.id)){WS.re.add(w.id); WS.items.push({w,m:"pr",retry:true});}}
  } else if(!ok&&!WS.re.has(w.id+it.m)){WS.re.add(w.id+it.m); WS.items.push({w,m:it.m});}
  touch(); save();
  setTimeout(()=>say(sp(w.pl)),120);
  const title=ok?(near?"Почти! Проверьте польские буквы":"Верно!"):"Не совсем";
  setBar(`<div class="fbt"><b>${title}</b><span><b class="pl">${w.pl}</b> — ${w.ru}</span>${gramInfo(w)?`<span class="muted">${gramInfo(w)}</span>`:""}${w.ex?`<span class="muted">${w.ex}</span>`:""}</div><button class="btn primary" data-act="wnext">Дальше</button>`,ok?"ok":"bad");
  barin.querySelector('[data-act="wnext"]')?.focus();
}
function finishWS(){
  const n=WS.words.length, tid=WS.tid;
  if(WS.kind==="drill"){
    WS.words.forEach(w=>{S.voc[w.id]={box:1,due:Date.now()+DAY};});
    if(S.vday.d!==today()) S.vday={d:today(),n:0};
    S.vday.n+=n; S.xp+=3*n; save();
    const left=(tid==="*"?allWords():wGroup(tid).words).some(w=>wStatus(w)==="new");
    WS={kind:"sum",tid,title:"Слова добавлены",sub:`${n} новых слов в тренировке`,big:`+${n}`,note:`Первое повторение завтра. Сегодня новых: ${S.vday.n} из ${S.goal}.`,more:left};
  } else {
    S.xp+=2*n; save();
    WS={kind:"sum",tid,title:"Повторение закончено",sub:`Повторено слов: ${n}`,big:`${Math.min(WS.ok,WS.items.length)} / ${WS.items.length}`,note:"Слова с ошибками вернутся завтра, остальные позже.",more:false};
  }
  renderWSession(); topStats();
}

}

function genCloze(lines,L,max){
  const D=dictOf(L), used=new Set(); let gaps=0;
  const pick=lines.slice(0,max);
  const out=pick.map((l,li)=>{
    const toks=l[1].split(" ");
    const cand=toks.map((t,ti)=>({t,ti,core:t.replace(/^[„"(«]+|[.,!?…»")]+$/g,"")}))
      .filter(c=>c.core.length>=3&&/^[a-ząćęłńóśźż]+$/.test(c.core)&&D[c.core]&&!used.has(c.core));
    const pre=l[0]?l[0]+": ":"";
    if(!cand.length) return pre+l[1];
    cand.sort((a,b)=>b.core.length-a.core.length);
    const c=cand[li%Math.min(2,cand.length)]; used.add(c.core); gaps++;
    toks[c.ti]=c.t.replace(c.core,"["+c.core+"]");
    return pre+toks.join(" ");
  });
  if(gaps<2) return null;
  return {t:"cloze",bank:true,audio:true,lines:parseCloze(out.join(" // ")),audioText:pick.map(l=>l[1]).join(" ")};
}
function genTableTasks(){
  Object.values(LESSONS).forEach(L=>{
    for(let i=0;i<L.steps.length;i++){
      const s=L.steps[i]; if(s.k!=="grammar"||!s.body) continue;
      const ex=[]; let cap=s.title;
      s.body.forEach(b=>{
        if(b&&b.h) cap=b.h;
        if(b&&b.t){
          const rows=b.t.split("|").map(r=>r.split(";")), hdr=rows[0], body=rows.slice(1);
          const ok=(c,ci)=>ci>0&&/^[a-ząćęłńóśźż ]+$/i.test(c.trim())&&c.trim().length>=2&&c.trim().split(" ").length<=4;
          /* "stół → na stole, okno → w oknie": the form after each arrow becomes a gap */
          const arrowSegs=c=>{ if(!c.includes("→")) return null; const segs=[]; let any=false;
            c.split(", ").forEach((it,k)=>{ if(k) segs.push(", "); const m=it.match(/^(.*?→ )([a-ząćęłńóśźż ]+)(\*?)$/i);
              if(m&&m[2].trim().length>=2){segs.push(m[1],{a:[m[2].trim()]}); if(m[3]) segs.push(m[3]); any=true;} else segs.push(it); });
            return any?segs:null; };
          const elig=[]; body.forEach((r,ri)=>r.forEach((c,ci)=>{ if(ok(c,ci)||(ci>0&&arrowSegs(c))) elig.push(ri+":"+ci); }));
          if(elig.length<2) return;
          const step=Math.max(1,Math.ceil(elig.length/10)), pick=new Set(elig.filter((_,k)=>k%step===0));
          const rowsX=body.map((r,ri)=>r.map((c,ci)=>({pr:"",segs:pick.has(ri+":"+ci)?(arrowSegs(c)||[{a:[c.trim()]}]):[c]})));
          ex.push({t:"tcloze",plain:true,pl:"Proszę uzupełnić tabelkę.",q:"Заполните пропуски в таблице",cap:cap.replace(/<[^>]+>/g,""),headPlain:hdr,rows:rowsX,lines:rowsX.map(r=>r.flatMap(c=>c.segs)),bank:true});
          return;
        }
        if(!b||!b.tbl) return;
        const {cells,stem}=splitForms(b.tbl);
        if(!cells.every(r=>r.every(c=>c.pr))||cells.flat().length<4) return;
        const rows=cells.map(r=>r.map(c=>{
          const plain=c.form.replace(/<[^>]+>/g,""), first=plain.split(" ")[0], rest=plain.slice(first.length);
          const end=stem&&first.startsWith(stem)?first.slice(stem.length):"";
          const segs=end?[stem,{a:[end]},rest]:[{a:[first]},rest];
          return {pr:c.pr,segs:segs.filter(x=>x!=="")};
        }));

const WKEY=pl=>norm(pl.replace(/…/g,""));
function wAdd(src){
  const k=WKEY(src.pl); let w=WALL.get(k);
  if(!w){w={id:k,k,pl:src.pl,ru:src.ru,ex:src.ex||"",exr:src.exr||"",topics:[],lesson:0,t:""}; WALL.set(k,w);}

function buildWordBank(){
  const ids=Object.keys(LESSONS).map(Number).sort((a,b)=>a-b);
  ids.forEach(n=>(LESSONS[n].vocab||[]).forEach(v=>{const w=wAdd(v); if(!w.lesson) w.lesson=n;}));
  WORDS.forEach(t=>{ const seen=new Set(); t.words=t.words.map(x=>{const w=wAdd(x); if(!w.topics.includes(t.id)) w.topics.push(t.id); return w;}).filter(w=>!seen.has(w.k)&&seen.add(w.k)); });
  WORDS.forEach(t=>{
    const ls=(TOPIC_LESSONS[t.id]||[46]).filter(n=>LESSONS[n]), free=t.words.filter(w=>!w.lesson);
    const per=Math.ceil(free.length/ls.length);
    free.forEach((w,i)=>{w.lesson=ls[Math.min(ls.length-1,Math.floor(i/per))];});
  });
  WALL.forEach(w=>{ if(!w.lesson) w.lesson=46; w.t=w.topics[0]||("L"+w.lesson); (LW[w.lesson]=LW[w.lesson]||[]).push(w); });
  /* move old progress (topic:word keys, lesson phrase review) to the shared keys */
  const voc={};
  Object.keys(S.voc||{}).forEach(key=>{const k=WKEY(key.includes(":")?key.slice(key.indexOf(":")+1):key); if(WALL.has(k)&&!voc[k]) voc[k]=S.voc[key];});
  Object.keys(S.srs||{}).forEach(pl=>{const k=WKEY(pl); if(WALL.has(k)&&!voc[k]) voc[k]={box:S.srs[pl].box||0,due:S.srs[pl].due||Date.now()};});
  S.voc=voc; S.srs={}; save();
}

function spread(arr,k){ if(arr.length<=k) return arr.slice(); const out=[]; for(let i=0;i<k;i++) out.push(arr[Math.floor(i*arr.length/k)]); return out; }
function tTable(pl,q,head,rows,cap,bank){ return {t:"tcloze",plain:true,pl,q,cap,headPlain:head,rows,lines:rows.map(r=>r.flatMap(c=>c.segs)),bank}; }
const cell=x=>({pr:"",segs:[x]}), gapc=a=>({pr:"",segs:[{a:[a]}]});
function genWordTasks(){
  Object.keys(LW).map(Number).forEach(n=>{
    const L=LESSONS[n], ws=LW[n]; if(!L||n<3) return;

    const single=w=>!/[\s\/…!?.]/.test(w.pl.trim());

    const verbs=ws.filter(w=>{const v=GV[gkey(w.pl)]; return v&&!/3 л/.test(v.f)&&gkey(w.pl)===w.pl.trim();});
    const adjs=ws.filter(w=>single(w)&&GA.has(gkey(w.pl))&&adjForms(gkey(w.pl))&&!/^(pierwszy|drugi|trzeci|który|jaki|najlepszy)$/.test(gkey(w.pl)));
    const ex=[];
    if(verbs.length>=2){
      const rows=spread(verbs,5).map(w=>{const f=GV[gkey(w.pl)].f.split(", "); return [cell(w.pl),gapc(f[0]),gapc(f[1])];});
      ex.push(tTable("Proszę uzupełnić tabelkę.","Формы глаголов этого урока: ja и ty (у совершенного вида это будущее время)",["bezokolicznik","ja","ty"],rows,"Czasowniki",false));

        gs.forEach((g,i)=>{ const a=gkey(ad[i%ad.length].pl), f=adjForms(a), nw=byG[g][i%byG[g].length]; lines.push(`(${a}) [${f[{m:0,ż:1,n:2}[g]]}] ${nw.pl}`); });

      }

      if(fem.length>=2) ex.push({t:"cloze",pl:"Proszę uzupełnić: biernik (kogo? co?).",q:"Поставьте в винительный падеж, как после mam, lubię, widzę: женский род на -a → -ę",lines:parseCloze(fem.map(w=>`${w.pl} → [${w.pl.slice(0,-1)}ę]`).join(" // ")),bank:false,extra:[]});
    }

      const pls=spread(nouns.filter(w=>{const p=GN[gkey(w.pl)].pl; return p&&p!=="—"&&!/[\/(]/.test(p)&&!/\s/.test(p)&&p!==w.pl;}),5);
      if(pls.length>=3) ex.push(tTable("Proszę uzupełnić tabelkę.","Множественное число (mianownik l. mn.)",["liczba pojedyncza","liczba mnoga"],pls.map(w=>[cell(w.pl),gapc(GN[gkey(w.pl)].pl)]),"Liczba mnoga",false));

    }

/* browser speech recognition (Chrome, Edge, Android) with the same interface as the claude.ai dictation capability */
function webDictation(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition; if(!R) return null;
  let rec=null, st="idle", fin=[], par=[], sts=[];
  const set=(x,reason)=>{st=x; sts.forEach(f=>f(reason?{state:x,reason}:{state:x}));};
  return {
    active:()=>st!=="idle",
    onFinal:f=>{fin.push(f);}, onPartial:f=>{par.push(f);}, onState:f=>{sts.push(f);},
    start:()=>new Promise((res,rej)=>{
      rec=new R(); rec.lang="pl-PL"; rec.interimResults=true; rec.continuous=false;
      rec.onstart=()=>{set("listening"); res();};
      rec.onresult=ev=>{let p=""; for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i]; if(r.isFinal) fin.forEach(f=>f({text:" "+r[0].transcript.trim()})); else p+=r[0].transcript;} par.forEach(f=>f({text:p}));};
      rec.onerror=ev=>{const c=ev.error==="not-allowed"||ev.error==="service-not-allowed"?"not_granted":"upstream_error"; if(st==="idle") rej({code:c}); set("idle",c);};
      rec.onend=()=>{par.forEach(f=>f({text:""})); if(st!=="idle") set("idle","stopped");};
      set("starting"); try{rec.start();}catch(e){set("idle","upstream_error"); rej({code:"upstream_error"});}
    }),
    stop:async()=>{ if(rec) rec.stop(); }
  };
}
/* one call to the AI: Claude inside claude.ai, otherwise the Worker. turns = [{role,content}], first and last are "user" */
async function aiCall(system,turns,{json=false,signal,onText}={}){
  if(SAMPLE){
    const input=[{role:"user",content:system},...turns];
    if(json) return SAMPLE.json(input,{cache:false,modelTier:"quick",signal});
    const r=await SAMPLE(input,{cache:false,signal,onText}); return r.text;
  }
  if(!AI_URL) throw {code:"not_granted"};
  let res;
  try{ res=await fetch(AI_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({system,messages:turns,json}),signal}); }
  catch(e){ throw {code:e&&e.name==="AbortError"?"cancelled":"upstream_error"}; }
  if(res.status===429){ let d={}; try{d=await res.json();}catch(e){} throw {code:"rate_limited",reason:d.error==="daily_limit"?"daily_limit":undefined}; }
  if(!res.ok) throw {code:"upstream_error"};
  const d=await res.json(); const text=String(d.text||"").trim(); if(!text) throw {code:"invalid_json"};
  if(!json) return text;
  try{ return JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g,"")); }catch(e){ const m=text.match(/\{[\s\S]*\}/); if(m) try{return JSON.parse(m[0]);}catch(e2){} throw {code:"invalid_json"}; }
}

    const r=await aiCall("You are a friendly Polish tutor.",[{role:"user",content:`You are a Polish tutor for a Russian-speaking learner at lesson ${curLesson()} of 46 (A1-A2). Here is a role-play "${sc.pl}" (goal: ${sc.goal}).\n\n${log}\n\nWrite feedback in Russian, plain text, no Markdown headings or tables: 1) what went well (1-2 lines); 2) the learner's main mistakes with corrected Polish and the grammar term (biernik, narzędnik...); 3) 3-6 useful Polish words or phrases for this situation with translation; 4) one score from 1 to 5. Keep it short.`}],{signal:RZ.ctl.signal,onText:({text})=>{th.textContent=text.replace(/\*\*/g,""); th.classList.remove("think");}});
    th.remove(); tPush({k:"note",text:r.replace(/\*\*/g,"")});
  }catch(e){ th.remove(); const m=tErr(e); if(m) tPush({k:"note",text:m}); }
  finally{ RZ.busy=false; RZ.ctl=null; }
}
function tMic(){
  if(!DICT) return;
  const btn=app.querySelector('[data-act="tmic"]');
  if(DICT.active()){ DICT.stop().catch(()=>{}); return; }
  if(!RZ.mic){
    RZ.mic=true;
    DICT.onFinal(({text})=>{const t=document.getElementById("tmsg"); if(!t) return; t.value=(t.value?t.value+text:text.trimStart()); t.dispatchEvent(new Event("input"));});
    DICT.onPartial(({text})=>{const t=document.getElementById("tmsg"); if(t) t.placeholder=text||"Napisz po polsku…";});
    DICT.onState(({state,reason})=>{const b=app.querySelector('[data-act="tmic"]'); if(b) b.classList.toggle("on",state!=="idle"); if(state==="idle"&&reason==="unavailable"){ tPush({k:"note",text:"Распознавание польской речи недоступно в этом браузере. Пишите текстом."}); }});
  }
  DICT.start(RZ.scene==="help"?{}:{language:"pl"}).catch(e=>{
    if(e&&e.code==="not_granted") tPush({k:"note",text:"Микрофон не разрешён. Можно писать текстом."});
    else if(e&&e.code==="unavailable") tPush({k:"note",text:"Польская диктовка здесь недоступна. Пишите текстом."});
  });
}
function boot(){
  buildWordBank();
  Object.values(LESSONS).forEach(L=>(L.vocab||[]).forEach(v=>{VMAP[v.pl]=v; if(!/\s/.test(v.pl.trim())) GDICT[norm(v.pl)]=v.ru;}));
  WORDS.forEach(t=>t.words.forEach(w=>w.pl.split(" / ").forEach(p=>{p=p.trim(); if(!/\s/.test(p)){const k=norm(p); if(k&&!GDICT[k]) GDICT[k]=w.ru;}})));
  genBookTasks();
  genWordTasks();
  genTableTasks();
  render();
  setTimeout(()=>{ loadVoices(); const vb=document.getElementById("vb"); if(vb&&plVoices.length) vb.remove(); },1200);
}
